[package]
name = "art-director"
version = "0.1.0"
description = "ArtDirector - a desktop gallery for game and project art"
authors = ["hawkk"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "art_director_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"

specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tga"] }
fast_image_resize = { version = "6", features = ["image"] }
blake3 = "1"
notify-debouncer-full = "0.5"
asefile = "0.3.8"
base64 = "0.22"
tauri-plugin-single-instance = "2.4.5"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
